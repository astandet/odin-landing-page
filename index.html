<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;800&display=optional" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="page">
            <div class="top">
                <header class="site-header">
                    <div class="logo"><img src="IMG/logoCropped.png" alt="fake logo of 'Reforestation Commission'"
                            width="666" height="655"></div>
                    <div class="links">
                        <ul>
                            <li><a href="#">Our Mission</a></li>
                            <li><a href="#">Active Projects</a></li>
                            <li><a href="#">Get Involved</a></li>
                        </ul>
                    </div>
                </header>
                <div class="hero">
                    <div class="hero-left">
                        <div class="largeText">Rebuilding forests,<br> one tree at a time.</div>
                        <div class="smallText">We work with communities, scientists and volunteers to restore native
                            woodlands, revive wildlife habitats and create healthier, greener landscapes for future
                            generations.
                        </div>
                        <div class="heroButton">
                            <button type="button" id="signup-btn">Sign up</button>
                        </div>
                    </div>
                    <div class="hero-right"><img src="IMG/monsterWhiteFrame.png" alt="green friendly monster">
                    </div>
                </div>
            </div>
        </div>
